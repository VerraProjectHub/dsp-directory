<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM0047 Data Service Providers (DSPs) Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .modal-open { overflow: hidden; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
      <div class="md:flex md:items-center md:justify-between">
        <div>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 mb-2">
            Verra VM0047 Resource
          </span>
          <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">
            Data Service Provider (DSP) Directory
          </h1>
          <p class="text-sm text-slate-500 mt-1">
            Approved and listed VM0047 Stocking Index (SI) and dynamic performance baselining providers.
          </p>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
        <input 
          id="searchInput" 
          type="text" 
          placeholder="Search by provider, product, or keyword..." 
          class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white"
        />
        <select 
          id="statusFilter" 
          class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white"
        >
          <option value="">All API Integration Statuses</option>
          <option value="Completed">API Completed</option>
          <option value="In progress">API In progress</option>
        </select>
        <select 
          id="resolutionFilter" 
          class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white"
        >
          <option value="">All Spatial Resolutions</option>
          <option value="10m">10m</option>
          <option value="30m">30m</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Main Content Cards -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="dspGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Modal for full technical responses -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-3xl max-h-[90vh] rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <div>
          <h3 id="modalTitle" class="text-xl font-bold text-slate-900"></h3>
          <p id="modalSubtitle" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modalContent" class="px-6 py-5 overflow-y-auto space-y-6 text-sm text-slate-700">
        <!-- Injected via JavaScript -->
      </div>
      <div class="px-6 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg transition">Close</button>
      </div>
    </div>
  </div>

    // Render Grid Cards

    function render(items) {
      grid.innerHTML = "";
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400">No DSP matches your search filters.</div>`;

      }

            <div class="flex items-start justify-between gap-2 mb-2">
              <h2 class="font-bold text-lg text-slate-900">${d.name}</h2>
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${badgeColor}">
                API: ${d.apiStatus}
              </span>
            </div>
            <p class="text-xs text-slate-400 mb-3">${d.hq} ${d.founded ? '• Est. ' + d.founded : ''}</p>
            <p class="text-xs text-slate-600 line-clamp-3 mb-4">${d.summary}</p>
            
            <div class="space-y-1.5 py-3 border-t border-slate-100 text-xs">

                <span class="font-semibold text-slate-700">${d.resolution}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Historical Series:</span>
                <span class="font-semibold text-slate-700">${d.years || 'Annual'}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Regions Served:</span>
                <span class="font-semibold text-slate-700">${d.regions}</span>
              </div>
            </div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">

            </button>
            <div class="flex items-center gap-2">
              ${d.url ? `<a href="${d.url}" target="_blank" class="text-slate-400 hover:text-slate-600 p-1" title="Website"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>` : ''}
              ${d.email ? `<a href="mailto:${d.email}" class="text-slate-400 hover:text-slate-600 p-1" title="Email"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></a>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal Details Handler
    function openModal(id) {
      const d = dspData.find(x => x.id === id);
      if (!d) return;

      document.getElementById("modalTitle").innerText = d.name;
      document.getElementById("modalSubtitle").innerText = `${d.hq} | VM0047 Version: ${d.versions}`;

      let linksHtml = '';
      if (d.url) linksHtml += `<a href="${d.url}" target="_blank" class="text-emerald-700 hover:underline mr-4">Website ↗</a>`;
      if (d.requestUrl) linksHtml += `<a href="${d.requestUrl}" target="_blank" class="text-emerald-700 hover:underline mr-4">Request SI Agreement ↗</a>`;
      if (d.whitepaper) linksHtml += `<a href="${d.whitepaper}" target="_blank" class="text-emerald-700 hover:underline mr-4">Public Whitepaper ↗</a>`;
      if (d.email) linksHtml += `<a href="mailto:${d.email}" class="text-emerald-700 hover:underline">Contact: ${d.email}</a>`;

      document.getElementById("modalContent").innerHTML = `
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs leading-relaxed">
          <strong class="text-slate-800">Quick Links:</strong> ${linksHtml || 'None provided'}
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">SI Product Name</h4>
          <p class="text-slate-900 font-medium">${d.product}</p>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Approach & Suitability for ARR</h4>
          <p class="leading-relaxed">${d.approach}</p>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">How SI is Produced (Imagery to Dataset)</h4>
          <p class="leading-relaxed">${d.production}</p>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Correlation with AGB</h4>
          <p class="leading-relaxed">${d.correlation}</p>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Field Plot Validation</h4>
          <p class="leading-relaxed">${d.fieldValidation}</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-100 pt-3">
          <div>
            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Limitations & Saturation</h4>
            <p class="text-xs text-slate-600">${d.limitations || 'Standard remote sensing limitations apply.'}</p>
          </div>
          <div>
            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Non-API Delivery</h4>
            <p class="text-xs text-slate-600">${d.deliveryNoApi || 'Standard cloud delivery.'}</p>
          </div>
        </div>
      `;

      document.body.classList.add("modal-open");
      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeModal() {
      document.body.classList.remove("modal-open");
      document.getElementById("detailModal").classList.add("hidden");
    }

    // Filter Logic
    function filterData() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;
      const res = document.getElementById("resolutionFilter").value;

      const filtered = dspData.filter(d => {
        const matchesQuery = d.name.toLowerCase().includes(q) || 
                             d.summary.toLowerCase().includes(q) || 
                             d.product.toLowerCase().includes(q) || 
                             d.hq.toLowerCase().includes(q);
        const matchesStatus = status ? d.apiStatus === status : true;
        const matchesRes = res ? d.resolution.includes(res) : true;
        return matchesQuery && matchesStatus && matchesRes;
      });

      render(filtered);
    }

    document.getElementById("searchInput").addEventListener("input", filterData);
    document.getElementById("statusFilter").addEventListener("change", filterData);
    document.getElementById("resolutionFilter").addEventListener("change", filterData);

    // Initial render
    render(dspData);
  </script>
</body>
</html>
