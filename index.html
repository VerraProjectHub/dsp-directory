<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM0047 Data Service Providers (DSPs) Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              50: "#f5f8fc",
              100: "#eef3fc",
              200: "#e2e9f3",
              300: "#cdd8e8",
              400: "#a4b4d4",
              500: "#5c6879",
              600: "#465875",
              700: "#19386e",
              800: "#0e2b64",
              900: "#0a2050"
            },
            emerald: {
              50: "#eef7e8",
              100: "#e3f2d8",
              500: "#82c34f",
              600: "#74b542",
              700: "#2f6b1e",
              800: "#285c1b",
              900: "#204c17"
            }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: light;
      --pr-ink: #0e2b64;
      --pr-ink-deep: #0a2050;
      --pr-green: #82c34f;
      --pr-teal: #047299;
      --pr-paper: #f5f8fc;
      --pr-line: #e2e9f3;
      --pr-radius-control: 15px;
      --pr-radius-card: 22px;
      --pr-radius-panel: 26px;
      --pr-header-surface: rgba(14, 43, 100, 0.92);
    }

    @font-face {
      font-family: "Figtree";
      src: url("/assets/fonts/figtree/figtree-variable.woff2") format("woff2-variations");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fraunces";
      src: url("/assets/fonts/fraunces/fraunces-variable.woff2") format("woff2-variations");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fraunces";
      src: url("/assets/fonts/fraunces/fraunces-variable-italic.woff2") format("woff2-variations");
      font-weight: 300 700;
      font-style: italic;
      font-display: swap;
    }

    body {
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 85% 0, rgba(58, 157, 196, 0.08), transparent 35rem),
        var(--pr-paper);
      font-family: "Figtree", "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .modal-open { overflow: hidden; }

    .registry-header,
    .directory-footer,
    .site-footer {
      flex-shrink: 0;
    }

    main {
      flex: 1 0 auto;
      width: 100%;
    }

    .directory-main {
      padding-top: clamp(1.5rem, 4vw, 3rem);
      padding-bottom: clamp(2rem, 5vw, 3.5rem);
    }

    .registry-header {
      background: var(--pr-header-surface);
      backdrop-filter: saturate(150%) blur(14px);
      -webkit-backdrop-filter: saturate(150%) blur(14px);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 30px -18px rgba(0, 0, 0, 0.6);
    }

    .registry-header h1 {
      color: #fff;
      font-family: "Fraunces", ui-serif, Georgia, serif;
      font-weight: 600;
      letter-spacing: -0.035em;
      text-align: center;
      font-size: clamp(1.35rem, 2.5vw, 1.875rem);
      line-height: 1.15;
    }

    .registry-heading-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
    }

    .registry-brand {
      display: inline-flex;
      align-items: center;
      color: #fff;
    }

    .registry-heading-spacer {
      justify-self: end;
      width: 109px;
    }

    .registry-brand-logo {
      display: block;
      width: 109px;
      height: 40px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .dsp-card h2,
    .modal-panel h3,
    .detail-section h4 {
      font-family: "Fraunces", ui-serif, Georgia, serif;
    }

    @media (max-width: 639px) {
      .registry-heading-row {
        grid-template-columns: auto 1fr;
        gap: 0.75rem;
      }

      .registry-brand-logo {
        width: 76px;
        height: auto;
      }

      .registry-header h1 {
        font-size: clamp(1.15rem, 5vw, 1.5rem);
      }

      .registry-heading-spacer {
        display: none;
      }
    }

    .search-controls {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) repeat(2, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 2rem;
      padding: clamp(16px, 2.5vw, 24px);
      border: 1px solid var(--pr-line);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 14px 34px rgba(14, 43, 100, 0.08);
    }

    .filter-field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 7px;
    }

    .filter-label {
      padding-left: 4px;
      color: #53647e;
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.035em;
    }

    .search-controls input,
    .search-controls select {
      width: 100%;
      min-height: 48px;
      border: 1px solid #d7e1ed;
      border-radius: 14px;
      padding: 0 15px;
      background-color: #f9fbfd;
      color: var(--pr-ink);
      font: inherit;
      font-size: 0.92rem;
      box-shadow: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
    }

    .search-controls input:focus,
    .search-controls select:focus {
      outline: none;
      border-color: var(--pr-green);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(130, 195, 79, 0.18);
    }

    .directory-intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .directory-intro h2 {
      margin: 0;
      color: var(--pr-ink);
      font-family: "Fraunces", ui-serif, Georgia, serif;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }

    .directory-intro p {
      margin: 6px 0 0;
      color: #5c6879;
      font-size: 0.95rem;
    }

    .results-count {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid #dce8d3;
      border-radius: 999px;
      background: #f0f7e9;
      color: #2f6b1e;
      font-size: 0.82rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .dsp-grid {
      align-items: stretch;
    }

    .dsp-card {
      min-height: 300px;
      padding: 24px;
    }

    .dsp-card h2 {
      font-size: 1.25rem;
      line-height: 1.25;
    }

    .dsp-provider-logo-frame {
      display: flex;
      height: 72px;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 12px;
      background: #f8fafd;
    }

    .dsp-provider-logo {
      display: block;
      max-width: min(100%, 180px);
      max-height: 46px;
      object-fit: contain;
    }

    .dsp-card .dsp-location {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #718096;
      font-size: 0.78rem;
    }

    .dsp-card .dsp-summary {
      color: #53647e;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .dsp-card .dsp-facts {
      margin-top: 1.1rem;
      border-color: #edf1f6;
      font-size: 0.78rem;
    }

    .dsp-card .dsp-facts > div {
      gap: 12px;
      padding: 3px 0;
    }

    .dsp-card .dsp-facts > div > span:last-child {
      text-align: right;
    }

    .dsp-card .dsp-actions {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-color: #edf1f6;
    }

    .dsp-card .registry-action {
      padding: 0.7rem 1rem;
      font-size: 0.82rem;
    }

    .dsp-card .api-status {
      flex: 0 0 auto;
    }

    .dsp-card .quick-link {
      display: inline-flex;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e9f3;
      border-radius: 12px;
      background: #f8fafd;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .dsp-card .quick-link:hover {
      border-color: #cdd8e8;
      background: #eef3fc;
      color: var(--pr-ink);
    }

    @media (max-width: 767px) {
      .search-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-field:first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .directory-intro {
        align-items: start;
        flex-direction: column;
      }

      .search-controls {
        grid-template-columns: minmax(0, 1fr);
      }

      .filter-field:first-child {
        grid-column: auto;
      }

      .dsp-card {
        min-height: 0;
        padding: 20px;
      }
    }

    .resource-badge {
      background: rgba(130, 195, 79, 0.16);
      color: #d3f1b9;
      border: 1px solid rgba(166, 220, 121, 0.32);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dsp-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-color: var(--pr-line);
      border-radius: var(--pr-radius-card);
      box-shadow: 0 8px 24px rgba(14, 43, 100, 0.07);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .dsp-card::before {
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--pr-green), #3a9dc4);
      content: "";
    }

    .dsp-card:hover {
      transform: translateY(-3px);
      border-color: #c5d6e9;
      box-shadow: 0 16px 32px rgba(14, 43, 100, 0.13);
    }

    .dsp-card > div:first-child > div:first-child > span {
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
    }

    .registry-action {
      background: var(--pr-green);
      color: #173c16;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(130, 195, 79, 0.2);
    }

    .registry-action:hover {
      background: #74b542;
      color: #102d12;
    }

    .detail-modal {
      background: rgba(7, 22, 52, 0.72);
    }

    .modal-panel {
      border: 1px solid rgba(226, 233, 243, 0.8);
      border-radius: var(--pr-radius-panel);
      box-shadow: 0 30px 80px rgba(7, 22, 52, 0.3);
    }

    .modal-heading {
      background:
        radial-gradient(ellipse at 90% 0, rgba(58, 157, 196, 0.14), transparent 22rem),
        #f5f8fc;
    }

    .modal-close:focus-visible,
    .modal-close:hover {
      color: var(--pr-ink);
      background: #e2e9f3;
    }

    .modal-panel button {
      border-radius: 12px;
    }

    #modalContent > div {
      border-radius: 14px;
    }

    #modalContent > .detail-section {
      padding: 14px 16px;
      border: 1px solid var(--pr-line);
      background: linear-gradient(135deg, #fff, #f8fafd);
    }

    .detail-section h4 {
      color: var(--pr-teal);
    }

    #modalContent button,
    #modalContent a {
      border-radius: 10px;
    }

    .site-footer {
      background: var(--pr-header-surface);
      color: #fff;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: saturate(150%) blur(14px);
      -webkit-backdrop-filter: saturate(150%) blur(14px);
    }

    .site-footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 4px 16px;
      width: 100%;
      min-height: 56px;
      box-sizing: border-box;
      padding: 8px clamp(16px, 4vw, 32px);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .site-footer p {
      margin: 0;
    }

    .site-footer-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 16px;
    }

    .site-footer a {
      color: #fff;
      text-decoration: none;
    }

    .site-footer a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (min-width: 768px) {
      .site-footer-content {
        flex-direction: row;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 639px) {
      .search-controls {
        padding: 14px;
        border-radius: 18px;
      }

      .modal-panel {
        border-radius: 24px 24px 0 0;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- Header -->
  <header class="registry-header sticky top-0 z-30 border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
      <div class="registry-heading-row">
        <div class="registry-brand" aria-label="Verra">
          <img class="registry-brand-logo" src="./logo.svg" alt="Verra" width="109" height="40" />
        </div>
        <h1>Data Service Provider (DSP) Directory</h1>
        <span class="registry-heading-spacer" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <!-- Main Content Cards -->
  <main class="directory-main max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="directory-intro">
      <div>
        <h2>Explore providers</h2>
        <p>Provider-submitted information about VM0047 Stocking Index (SI) and dynamic performance-baselining data services.</p>
      </div>
      <span class="results-count" id="resultsCount" aria-live="polite"></span>
    </div>
    <!-- Search & Filters -->
    <div class="search-controls grid grid-cols-1 sm:grid-cols-3 gap-3">
      <label class="filter-field">
        <span class="filter-label">Search providers</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Name, product, location..."
          aria-label="Search providers"
        />
      </label>
      <label class="filter-field">
        <span class="filter-label">API integration</span>
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="Completed">API Completed</option>
          <option value="In progress">API In progress</option>
        </select>
      </label>
      <label class="filter-field">
        <span class="filter-label">Spatial resolution</span>
        <select id="resolutionFilter">
          <option value="">All resolutions</option>
          <option value="10m">10m</option>
          <option value="30m">30m</option>
        </select>
      </label>
    </div>
    <div id="dspGrid" class="dsp-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Injected via JavaScript -->
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-footer-content">
      <p>© 2026 Verra All rights reserved.</p>
      <nav class="site-footer-links" aria-label="Footer">
        <a href="https://verra.org/trust-and-security/" target="_blank" rel="noopener noreferrer">Trust &amp; Security</a>
        <a href="https://verra.org/verra-website-terms-and-conditions-of-use/" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a>
        <a href="https://verra.org/about-verra/logos/" target="_blank" rel="noopener noreferrer">Logo Use Request</a>
      </nav>
    </div>
  </footer>

  <!-- Modal for full technical responses -->
  <div id="detailModal" class="detail-modal fixed inset-0 z-50 hidden backdrop-blur-sm flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="modal-panel bg-white w-full sm:max-w-3xl max-h-[90vh] rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <div class="modal-heading px-6 py-4 border-b border-slate-200 flex justify-between items-center">
        <div>
          <h3 id="modalTitle" class="text-xl font-bold text-slate-900"></h3>
          <p id="modalSubtitle" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <button onclick="closeModal()" class="modal-close text-slate-400 p-1.5 rounded-lg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modalContent" class="px-6 py-5 overflow-y-auto space-y-6 text-sm text-slate-700">
        <!-- Injected via JavaScript -->
      </div>
      <div class="px-6 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
        <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg transition">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Embedded DSP responses directly from CSV data
    const dspData = [
      {
            "id": "belian",
            "name": "Belian Earth",
            "hq": "Wantage (East Hanney), United Kingdom",
            "founded": "",
            "url": "https://belian.earth",
            "requestUrl": "https://belian.earth/science/vm0047",
            "summary": "belian.earth builds locally-trained, project-specific counterfactual baselines for nature-based carbon projects (ARR, REDD+, IFM). For ARR under VM0047, its ramet47 platform narrows the comparison area using satellite embeddings, then matches project and control plots on a stocking index.",
            "approach": "Locally-trained, GEDI-calibrated stocking index (canopy height RH98 + canopy density PAI), delivered annually at 30 m with no gap years, and a two-stage matching design: an AlphaEarth-embedding refinement limits the donor pool to environmentally comparable ground, then formal SI matching (VM0047 Appendix 1, A1.4) selects the controls. Matching is deterministic and reproducible for VVB review, and data sources, versions and weights are documented. Validated on the first issued VM0047 ARR project (Brazil Cerrado 1, VCS 5511), where the reproduced benchmark approaches the registered value. Before contacting us: SI is provided only where SI-AGB correlation can be evidenced for the forest type or ecoregion; the SI carries only the relative benchmark, so absolute tonnes still come from field plots; proponent field data is not required but improves calibration and tightens prediction intervals; where a remote-sensing t = 0 estimate of pre-existing biomass is needed, we supply the conservative upper 90% bound.",

            "correlation": "Four lines of evidence: held-out GEDI test (geographic split) with RH98 r2 about 0.72, RMSE about 2.5 m; swisstopo airborne-lidar canopy height, r 0.83-0.92; cross-comparison with CTrees biomass (r2 about 0.68-0.73, 2012-2024) and ESA CCI Biomass; and recovery of the benchmark on the first issued VM0047 project (VCS 5511). Local field plots, studies or inventory data are used where available. SI is not provided where correlation cannot be shown.",

            "apiStatus": "In progress",

      {
            "id": "cyclops",
            "name": "CYCLOPS",
            "hq": "Lewes, Delaware, United States",
            "founded": "",
            "url": "https://www.cyclops.ai",
            "requestUrl": "",
            "summary": "US-incorporated dMRV company built on dClimate's EarthOS. For VM0047 it provides an annual 10 m aboveground-biomass map used as the stocking index, and supports the full workflow from eligibility and dynamic baseline to the PDD and monitoring report.",
            "approach": "Annual 10 m aboveground biomass (t/ha), not a proxy index, derived from a self-supervised foundation model (Barlow Twins / TESSERA) of Sentinel-1/2 time series that is gap-free, calibrated to GEDI and airborne LiDAR and checked against in-situ agroforestry plots. Built on public data and peer-reviewed methods so VVBs and third parties can review it. CYCLOPS has served as a DSP on VM0047-relevant projects in Brazil, Kenya, India, Sierra Leone, Tanzania and Vietnam, and supports eligibility, donor pool and control selection, the performance benchmark (SDM and z-test), carbon quantification, risk and leakage, and PDD and monitoring report drafting. Before contacting us: a pre-deployment correlation assessment is run for each project; if the forest stratum is under-represented in the training data, SI is withheld until independent reference data (airborne LiDAR, GEDI L4A, inventory plots) confirm local correlation, and delivery is suspended if correlation falls below about R2 0.6. GEDI covers roughly 50 degrees N-S; ICESat-2 is used outside.",

            "correlation": "Comparison with GEDI shows strong correlation across all Olson biomes; independent validation includes NEON field plots (R2 = 0.76), USFS FIA plots (R2 = 0.90) and Brazilian airborne-lidar biomass transects (R2 = 0.74-0.90). For each project, correlation is shown with customer field measurements, public regional datasets or GEDI-derived biomass.",
            "limits": "",
            "resolution": "30m",
            "years": "2000-2025",
            "updateFrequency": "Annual",
            "regions": "Global",
            "limitations": "Some cloud contamination can remain even after QA masking; Chloris applies its own custom cloud mask to reduce it.",
            "projectSize": "",
            "fieldValidation": "Yes: NEON field plots (R2 = 0.76), USFS FIA plots (R2 = 0.90), airborne-lidar biomass transects in Brazil (R2 = 0.74-0.90); customer field data are used for individual projects.",
            "whitepaper": "https://www.chloris.earth/key-documents",
            "methodChanges": "We will notify Verra of any material updates or changes to SI generation methods or selection procedures that affect previously provided project data, and of any proponent-requested changes that do the same.",
            "apiStatus": "In progress",
            "deliveryNoApi": "",
            "auditDocumentation": "Yes. We will deliver the SI dataset, project/control plot inputs and code or process documentation in auditable formats on request from the proponent, Verra or a VVB."
      }
];

    // Render Grid Cards
    const grid = document.getElementById("dspGrid");
    const dspLogos = {
      belian: "./Dsp_logos/belian_earth.png",
      chloris: "./Dsp_logos/chloris.png",
      cyclops: "./Dsp_logos/CYCLOPS-logo-black.png",
      kanop: "./Dsp_logos/kanop.png",
      lobelia: "./Dsp_logos/logo-lobelia-black.svg",
      sylvera: "./Dsp_logos/sylvera.png",
      terracarbon: "./Dsp_logos/terracarbon.png",
      treefera: "./Dsp_logos/Treefera_Logo_Tagline%20Stacked_Black.png",
      tspc: "./Dsp_logos/transparenc-logo-light-background.svg",
      varaha: "./Dsp_logos/varaha-logo.svg"
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function safeWebUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? escapeHtml(url.href) : "";
      } catch {
        return "";
      }
    }

    function detailSection(label, value) {
      return `
        <section class="detail-section">
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">${label}</h4>
          <p class="leading-relaxed">${escapeHtml(value || "Not provided in response.")}</p>
        </section>
      `;
    }

    function render(items) {
      document.getElementById("resultsCount").textContent =
        `${items.length} ${items.length === 1 ? "provider" : "providers"}`;
      grid.innerHTML = "";
      if (items.length === 0) {
        grid.innerHTML = `<div class="col-span-full rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center text-slate-500">No providers match these filters. Try changing your search or selections.</div>`;
        return;
      }

      items.forEach(d => {
        const isCompleted = d.apiStatus === "Completed";
        const badgeColor = isCompleted ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800";

        const card = document.createElement("div");
        card.className = "dsp-card bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            ${dspLogos[d.id] ? `<div class="dsp-provider-logo-frame"><img class="dsp-provider-logo" src="${escapeHtml(dspLogos[d.id])}" alt="${escapeHtml(d.name)} logo" loading="lazy" decoding="async"></div>` : ''}
            <div class="flex items-start justify-between gap-2 mb-2">
              <h2 class="font-bold text-lg text-slate-900">${escapeHtml(d.name)}</h2>
              <span class="api-status inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${badgeColor}">
                API: ${escapeHtml(d.apiStatus)}
              </span>
            </div>
            <p class="dsp-location mb-3">${escapeHtml(d.hq)} ${d.founded ? '• Est. ' + escapeHtml(d.founded) : ''}</p>
            <p class="dsp-summary line-clamp-3 mb-4">${escapeHtml(d.summary)}</p>
            
            <div class="dsp-facts space-y-1.5 py-3 border-t border-slate-100 text-xs">
              <div class="flex justify-between">
                <span class="text-slate-400">Resolution:</span>
                <span class="font-semibold text-slate-700">${escapeHtml(d.resolution || "Not provided")}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">SI years:</span>
                <span class="font-semibold text-slate-700">${escapeHtml(d.years || "Not provided")}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Update frequency:</span>
                <span class="font-semibold text-slate-700">${escapeHtml(d.updateFrequency || "Not provided")}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Regions Served:</span>
                <span class="font-semibold text-slate-700">${escapeHtml(d.regions || "Not provided")}</span>
              </div>
            </div>
          </div>

          <div class="dsp-actions mt-4 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
            <button onclick="openModal('${d.id}')" class="registry-action text-xs font-semibold px-3 py-1.5 rounded-md transition">
              Full Details →
            </button>
            <div class="flex items-center gap-2">
              ${d.url ? `<a href="${safeWebUrl(d.url)}" target="_blank" rel="noopener noreferrer" class="quick-link text-slate-400 hover:text-slate-600 p-1" title="Website" aria-label="Visit ${escapeHtml(d.name)} website"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>` : ''}
              ${d.email ? `<a href="mailto:${escapeHtml(d.email)}" class="quick-link text-slate-400 hover:text-slate-600 p-1" title="Email" aria-label="Email ${escapeHtml(d.name)}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></a>` : ''}
            </div>
          </div>
        `;
        card.addEventListener("click", event => {
          if (event.target.closest("a, button")) return;
          openModal(d.id);
        });
        grid.appendChild(card);
      });
    }

    // Modal Details Handler
    function openModal(id) {
      const d = dspData.find(x => x.id === id);
      if (!d) return;

      document.getElementById("modalTitle").innerText = d.name;
      document.getElementById("modalSubtitle").innerText = `${d.hq} | VM0047 Version: ${d.versions}`;

      let linksHtml = '';
      if (d.url && safeWebUrl(d.url)) linksHtml += `<a href="${safeWebUrl(d.url)}" target="_blank" rel="noopener noreferrer" class="text-emerald-700 hover:underline mr-4">Website ↗</a>`;
      if (d.requestUrl && safeWebUrl(d.requestUrl)) linksHtml += `<a href="${safeWebUrl(d.requestUrl)}" target="_blank" rel="noopener noreferrer" class="text-emerald-700 hover:underline mr-4">Request SI Agreement ↗</a>`;
      if (d.whitepaper && safeWebUrl(d.whitepaper)) linksHtml += `<a href="${safeWebUrl(d.whitepaper)}" target="_blank" rel="noopener noreferrer" class="text-emerald-700 hover:underline mr-4">Public Whitepaper ↗</a>`;
      if (d.email) linksHtml += `<a href="mailto:${escapeHtml(d.email)}" class="text-emerald-700 hover:underline">Contact: ${escapeHtml(d.email)}</a>`;

      document.getElementById("modalContent").innerHTML = `
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs leading-relaxed">
          <strong class="text-slate-800">Quick Links:</strong> ${linksHtml || 'None provided in response.'}
        </div>

        ${detailSection("SI Product Name", d.product)}
        ${detailSection("Approach: Suitability for ARR and What Proponents Should Know", d.approach)}
        ${detailSection("How the SI Is Produced", d.production)}
        ${detailSection("How SI Correlation with AGB Is Shown", d.correlation)}
        ${detailSection("Limits or Conditions on Use of Data", d.limits)}
        ${detailSection("Limitations of the Data", d.limitations)}
        ${detailSection("Validation Against Field Plot Data", d.fieldValidation)}
        ${detailSection("Typical Project Size Range (ha)", d.projectSize)}
        ${detailSection("Handling and Communicating SI Method Changes", d.methodChanges)}
        ${detailSection("Data Delivery if No API Connection Yet", d.deliveryNoApi)}
        ${detailSection("Auditable Documentation on Request", d.auditDocumentation)}
      `;

      document.body.classList.add("modal-open");
      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeModal() {
      document.body.classList.remove("modal-open");
      document.getElementById("detailModal").classList.add("hidden");
    }

    // Filter Logic
    function filterData() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const status = document.getElementById("statusFilter").value;
      const res = document.getElementById("resolutionFilter").value;

      const filtered = dspData.filter(d => {
        const searchableText = [
          d.name, d.hq, d.summary, d.product, d.approach, d.production,
          d.correlation, d.limits, d.limitations, d.fieldValidation,
          d.methodChanges, d.auditDocumentation
        ].join(" ").toLowerCase();
        const matchesQuery = searchableText.includes(q);
        const matchesStatus = status ? d.apiStatus === status : true;
        const matchesRes = res ? d.resolution.includes(res) : true;
        return matchesQuery && matchesStatus && matchesRes;
      });

      render(filtered);
    }

    document.getElementById("searchInput").addEventListener("input", filterData);
    document.getElementById("statusFilter").addEventListener("change", filterData);
    document.getElementById("resolutionFilter").addEventListener("change", filterData);

    // Initial render
    render(dspData);
  </script>
</body>
</html>
